<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>قدح · الكتالوج</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ===== إعدادات الألوان والخطوط ===== */
  :root{
    --paper:      #F4EADB;  /* كريمي: خلفية الصفحة */
    --card:       #FBF5EC;  /* كريمي أفتح: خلفية البطاقة */
    --burgundy:   #6A1B2A;  /* عنابي: اللون الأساسي للعلامة */
    --burgundy-2: #4E1220;  /* عنابي غامق: النصوص الأساسية */
    --gold:       #A9834E;  /* ذهبي هادئ: لمسة فخامة */
    --ink:        #33261F;  /* لون النص العام */
    --muted:      #8B7B6A;  /* نص ثانوي */
    --line:       #E4D6C2;  /* خطوط فاصلة */
    --shadow:     0 10px 30px rgba(78, 18, 32, .08);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: "Tajawal", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; text-decoration: none; }
  img{ display:block; max-width:100%; }

  /* ===== شريط تنبيه وضع العرض التجريبي ===== */
  .devbar{
    background: var(--burgundy-2);
    color: #F4EADB;
    text-align: center;
    font-size: 13px;
    padding: 8px 16px;
  }
  .devbar b{ color: #E6C99A; font-weight: 700; }

  /* ===== الهيدر ===== */
  .site-head{
    background: var(--burgundy);
    color: var(--paper);
  }
  .head-inner{
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px 24px 30px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .brand__mark{
    font-family: "Amiri", serif;
    font-weight: 700;
    font-size: clamp(40px, 7vw, 62px);
    line-height: 1;
    color: #FBF5EC;
    letter-spacing: 1px;
  }
  .brand__mark::after{
    content:"";
    display:block;
    width: 54px;
    height: 2px;
    background: var(--gold);
    margin-top: 10px;
  }
  .brand__sub{
    font-size: 15px;
    color: #E7CFB0;
    margin-top: 10px;
    letter-spacing: .3px;
  }

  /* ===== شريط التحكم (بحث + تصنيفات) ===== */
  .controls{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 6px;
  }
  .search-wrap{
    position: relative;
    max-width: 460px;
  }
  .search{
    width: 100%;
    padding: 13px 46px 13px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease;
  }
  .search:focus{ border-color: var(--burgundy); }
  .search-wrap svg{
    position: absolute;
    inset-inline-end: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    stroke: var(--muted);
    pointer-events: none;
  }

  .chips{
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 18px;
  }
  .chip{
    font-family: inherit;
    font-size: 14px;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--burgundy-2);
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:hover{ border-color: var(--burgundy); }
  .chip[aria-pressed="true"]{
    background: var(--burgundy);
    border-color: var(--burgundy);
    color: #FBF5EC;
  }

  .count{
    margin-top: 16px;
    font-size: 14px;
    color: var(--muted);
  }

  /* ===== شبكة المنتجات ===== */
  .catalog{
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 24px 60px;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
    gap: 22px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 16px 36px rgba(78, 18, 32, .13);
  }

  .card__media{
    position: relative;
    aspect-ratio: 1 / 1;
    background: #EFE2CE url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%236A1B2A' stroke-width='2' stroke-linecap='round' opacity='0.28'><circle cx='60' cy='46' r='12'/><path d='M60 34c-8-6-18 0-14 9M60 34c8-6 18 0 14 9M48 55c-9 2-12 13-3 16M72 55c9 2 12 13 3 16M60 58c-7 5-4 15 0 15 4 0 7-10 0-15Z'/><path d='M60 73v26M60 84c-8-2-15 3-18 10M60 90c8-2 15 3 18 10'/></g></svg>") center/64px no-repeat;
    overflow: hidden;
  }
  .card__media img{
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .4s ease;
  }
  .card:hover .card__media img{ transform: scale(1.045); }

  .badge{
    position: absolute;
    inset-block-start: 10px;
    inset-inline-start: 10px;
    background: var(--burgundy);
    color: #FBF5EC;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 11px;
    border-radius: 999px;
    letter-spacing: .3px;
  }

  .card__body{
    padding: 15px 16px 17px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex: 1;
  }
  .card__tag{
    font-size: 12.5px;
    color: var(--gold);
    font-weight: 500;
  }
  .card__name{
    font-family: "Amiri", serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--burgundy-2);
    line-height: 1.35;
  }
  .card__foot{
    margin-top: auto;
    padding-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid var(--line);
  }
  .card__price{
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
  }
  .card__price span{ font-size: 13px; font-weight: 500; color: var(--muted); }
  .card__cta{
    font-size: 14px;
    font-weight: 500;
    color: var(--burgundy);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .card__cta svg{ width: 15px; height: 15px; stroke: var(--burgundy); }

  /* ===== الحالات الفارغة والتحميل ===== */
  .state{
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
  }
  .state h2{
    font-family: "Amiri", serif;
    color: var(--burgundy-2);
    font-weight: 700;
    margin: 0 0 6px;
  }
  .skeleton .card__media{ background: #EAD9C2; }
  .skeleton .card__body > *{ background: #EFE2CE; color: transparent; border-radius: 6px; }

  /* ===== الفوتر ===== */
  .site-foot{
    background: var(--burgundy);
    color: #E7CFB0;
    text-align: center;
    padding: 22px 16px;
    font-size: 13.5px;
  }
  .site-foot b{ color: #FBF5EC; font-weight: 700; }

  @media (max-width: 480px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .card__name{ font-size: 18px; }
    .card__cta span{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

  <!-- شريط يظهر فقط في وضع العرض التجريبي -->
  <div class="devbar" id="devbar" hidden>
    عرض تجريبي · هذي بيانات وهمية للتصميم فقط. أضف مفتاح <b>anon</b> بالأعلى في الكود حتى تظهر منتجاتك الحقيقية من قاعدة البيانات.
  </div>

  <header class="site-head">
    <div class="head-inner">
      <div class="brand">
        <div class="brand__mark">قدح</div>
        <div class="brand__sub">توصيل ورد فاخر · بغداد</div>
      </div>
    </div>
  </header>

  <section class="controls">
    <div class="search-wrap">
      <input class="search" id="search" type="search" placeholder="ابحث عن منتج أو رقم صنف…" autocomplete="off" />
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
  </section>

  <main class="catalog">
    <div class="grid" id="grid"></div>
    <div class="state" id="state" hidden></div>
  </main>

  <footer class="site-foot">
    <b>قدح</b> · Al Hanoot for General Trading
  </footer>

<script>
/* =========================================================
   الإعدادات — عدّل هنا فقط
   ========================================================= */
const SUPABASE_URL = "https://tsqkqoibfxachknfmzjj.supabase.co";

// مفتاح anon العام (publishable). آمن يكون بالواجهة لأن الحماية عبر RLS.
// استبدل النص أدناه بمفتاح anon الحقيقي من إعدادات المشروع في Supabase.
const SUPABASE_ANON_KEY = "sb_publishable_JyCAQnMnltVq9nESIZjNew_St2FI6Ch";

/* رابط تخزين الصور: image_url مخزّن كمسار نسبي مثل images/item2.jpg */
const IMAGE_BASE = SUPABASE_URL + "/storage/v1/object/public/product-images/";

/* =========================================================
   جلب المنتجات من الـ view العام catalog_public
   ========================================================= */
const state = { all: [], filter: "الكل", query: "" };

async function loadProducts(){
  renderSkeleton();

  // إذا المفتاح لسه ما تغيّر، نشغّل وضع العرض التجريبي
  if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "PUT_YOUR_ANON_KEY_HERE"){
    document.getElementById("devbar").hidden = false;
    state.all = demoProducts();
    afterLoad();
    return;
  }

  const cols = "id,code,name_ar,name_en,price,category,occasion,note,featured,image_url";
  const url  = `${SUPABASE_URL}/rest/v1/catalog_public?select=${cols}&order=featured.desc,code.asc`;

  try{
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY
      }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.all = await res.json();
    afterLoad();
  }catch(err){
    showState(
      "تعذّر تحميل المنتجات",
      "تأكد من مفتاح anon ومن أن الزائر يملك SELECT على catalog_public. " + err.message
    );
  }
}

function afterLoad(){
  if (!state.all.length){
    showState("لا توجد منتجات بعد", "أضف منتجات نشطة من لوحة التحكم وستظهر هنا مباشرة.");
    return;
  }
  buildChips();
  render();
}

/* =========================================================
   الفلترة والبحث (على البيانات المحمّلة، بدون طلبات إضافية)
   ========================================================= */
function tagOf(p){ return (p.occasion || p.category || "").trim(); }

function buildChips(){
  const tags = [...new Set(state.all.map(tagOf).filter(Boolean))];
  const chips = ["الكل", ...tags];
  const box = document.getElementById("chips");
  box.innerHTML = "";
  chips.forEach(t=>{
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = t;
    b.setAttribute("aria-pressed", t === state.filter);
    b.onclick = ()=>{ state.filter = t; render(); syncChips(); };
    box.appendChild(b);
  });
}
function syncChips(){
  document.querySelectorAll(".chip").forEach(c=>{
    c.setAttribute("aria-pressed", c.textContent === state.filter);
  });
}

function visibleProducts(){
  const q = state.query.trim().toLowerCase();
  return state.all.filter(p=>{
    const okTag = state.filter === "الكل" || tagOf(p) === state.filter;
    const hay = `${p.name_ar||""} ${p.name_en||""} ${p.code||""}`.toLowerCase();
    const okQ = !q || hay.includes(q);
    return okTag && okQ;
  });
}

/* =========================================================
   العرض
   ========================================================= */
function priceText(v){
  const n = Number(v||0);
  return n.toLocaleString("en-US") + " <span>د.ع</span>";
}
function imgUrl(p){
  if (!p.image_url) return "";
  // لو انحفظ مسار كامل بالغلط نستعمله كما هو، غير هيك نبنيه من قاعدة التخزين
  return /^https?:\/\//.test(p.image_url) ? p.image_url : IMAGE_BASE + p.image_url;
}

function render(){
  const list = visibleProducts();
  const grid = document.getElementById("grid");
  const st   = document.getElementById("state");

  document.getElementById("count").textContent =
    `عدد المنتجات: ${list.length}` + (state.filter !== "الكل" ? ` · ${state.filter}` : "");

  if (!list.length){
    grid.innerHTML = "";
    showState("لا توجد نتائج", "جرّب كلمة بحث ثانية أو اختر «الكل».");
    return;
  }
  st.hidden = true;

  grid.innerHTML = list.map(p=>{
    const tag = tagOf(p);
    const src = imgUrl(p);
    const img = src
      ? `<img src="${src}" alt="${escapeHtml(p.name_ar||"")}" loading="lazy" onerror="this.remove()" />`
      : "";
    const badge = p.featured ? `<div class="badge">مميّز</div>` : "";
    return `
      <a class="card" href="product.html?id=${p.id}">
        <div class="card__media">${img}${badge}</div>
        <div class="card__body">
          ${tag ? `<div class="card__tag">${escapeHtml(tag)}</div>` : ""}
          <div class="card__name">${escapeHtml(p.name_ar || p.name_en || "بدون اسم")}</div>
          <div class="card__foot">
            <div class="card__price">${priceText(p.price)}</div>
            <span class="card__cta">
              <span>عرض التفاصيل</span>
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
            </span>
          </div>
        </div>
      </a>`;
  }).join("");
}

function renderSkeleton(){
  const grid = document.getElementById("grid");
  grid.classList.add("skeleton");
  grid.innerHTML = Array.from({length:8}).map(()=>`
    <div class="card">
      <div class="card__media"></div>
      <div class="card__body">
        <div class="card__tag">تحميل</div>
        <div class="card__name">تحميل المنتج</div>
        <div class="card__foot"><div class="card__price">00000</div></div>
      </div>
    </div>`).join("");
  setTimeout(()=>grid.classList.remove("skeleton"), 0);
}

function showState(title, body){
  document.getElementById("grid").innerHTML = "";
  const st = document.getElementById("state");
  st.hidden = false;
  st.innerHTML = `<h2>${escapeHtml(title)}</h2><p>${escapeHtml(body)}</p>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

/* =========================================================
   بيانات تجريبية للعرض فقط (تختفي عند إضافة مفتاح anon)
   ========================================================= */
function demoProducts(){
  return [
    {id:1, code:101, name_ar:"باقة الورد الجوري", occasion:"رومانسية", price:45000, featured:true},
    {id:2, code:102, name_ar:"تنسيق الأوركيد الأبيض", occasion:"أناقة", price:65000, featured:true},
    {id:3, code:103, name_ar:"ورد العروس", occasion:"أعراس", price:120000, featured:true},
    {id:4, code:104, name_ar:"صندوق الورد المخملي", occasion:"هدايا", price:55000},
    {id:5, code:105, name_ar:"باقة التوليب الملكي", occasion:"مناسبات", price:40000},
    {id:6, code:106, name_ar:"تنسيق الليليوم", occasion:"تعزية", price:50000},
    {id:7, code:107, name_ar:"باقة الجربيرا الملوّنة", occasion:"تهاني", price:35000},
    {id:8, code:108, name_ar:"صندوق الورد والشوكولا", occasion:"هدايا", price:70000},
  ];
}

/* =========================================================
   التشغيل
   ========================================================= */
document.getElementById("search").addEventListener("input", e=>{
  state.query = e.target.value;
  render();
});
loadProducts();
</script>
</body>
</html>
